  <style>
    /* Year nav */
    .year-nav {
      display: flex;
      gap: 20px;
      //padding: 18px 100px 14px;
      overflow-x: auto;
      scrollbar-width: none;
      //border-bottom: 1px solid #eee;

      max-width: 1400px;
      margin: 0 auto;
      padding: 0 60px 15px;
      box-sizing: border-box;
    }
    .year-nav::-webkit-scrollbar { display: none; }
    .year-btn {
      flex: 0 0 auto;
      background: none;
      border: none;
      font: inherit;
      font-size: 1.4rem;
      font-weight: 600;
      color: #aaa;
      letter-spacing: 0.02em;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 999px;
      transition: color 0.2s ease, background 0.2s ease;
    }
    .year-btn:hover { color: #555; }
    .year-btn.active {
      color: #fff;
      background: #000;
    }

    /* Scroll track */
    .track {
      display: none;
      overflow-x: auto;
      overflow-y: visible;
      scroll-behavior: smooth;
      border-top: 1px solid #eee;
    }
    ::-webkit-scrollbar {
    display: none;
    }
    .track.active { display: flex; }
    .year-nav { display: none; }
    .year-nav.active { display: flex; }
    .track::-webkit-scrollbar { height: 8px; }
    .track::-webkit-scrollbar-track { background: transparent; }
    .track::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    .panel {
      flex: 0 0 auto;
      width: 900px;
      padding: 50px 100px 60px;
      display: grid;
      grid-template-columns: minmax(280px, 320px) 1fr;
      gap: 48px;
      box-sizing: border-box;
      position: relative;
      border-right: 1px solid #eee;
    }
    .panel:first-child {
      padding-left: calc((100vw - min(100vw, 1400px)) / 2 + 60px);
    }
    .panel.wide {
      width: 1180px;
    }
    .panel.wide .panel-projects {
      grid-template-columns: repeat(2, 1fr);
    }
    .panel.compact {
      grid-template-columns: minmax(280px, 320px) 1fr;
      grid-template-rows: auto 1fr;
      column-gap: 48px;
      row-gap: 28px;
    }
    .panel.compact > .panel-year {
      grid-column: 1 / -1;
    }
    .panel.compact .panel-projects {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .panel.compact .panel-projects .project-card {
      max-width: 320px;
    }
    .panel:last-child { border-right: none; }
    .panel-meta {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .panel-year {
      font-size: 9rem;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: #000;
      margin: 0;
    }
    .panel-year .range {
      display: block;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #999;
      margin-top: 6px;
    }
    .company {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .company-logo {
      height: 60px;
      max-width: 220px;
      margin-bottom: 6px;
      object-fit: contain;
      object-position: left center;
      mix-blend-mode: multiply;
      isolation: isolate;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .company .role {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
      color: #000;
    }
    .company .dates {
      font-size: 1.2rem;
      color: rgba(0,0,0,0.45);
      margin: 0;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .company .blurb {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(0,0,0,0.7);
      margin: 6px 0 0;
    }

    .panel-projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      align-content: start;
    }
    .project-card {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .project-card img {
      width: 100%;
      display: block;
      border-radius: 4px;
      border: 1px solid #ececec;
      box-shadow: 0 1px 2px rgba(0,0,0,0);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }
    .project-card.no-link { cursor: default; }
    .project-card.no-link:hover img,
    .project-card.no-link:hover .title::after { transform: none; box-shadow: none; opacity: inherit; }
    .project-card.no-link .title::after { content: none; }
    .project-card:hover img {
      box-shadow: 0 7px 22px rgba(0,0,0,0.18);
      transform: translateY(-2px);
    }
    .project-card .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 12px 0 4px;
      color: #000;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: space-between;
    }
    .project-card .title::after {
      //content: url('images/arrow_outward_20dp.svg');
      transition: transform 0.25s ease, color 0.25s ease;
      opacity: .35;
      height:20px;
    }
    .project-card:hover .title::after {
      opacity: 1.0;
    }
    .title .img{
      width: 20px;
      float: right;
    }
    .project-card .desc {
      font-size: 16px;
      line-height: 1.5;
      color: rgba(0,0,0,0.6);
      margin: 0;
    }

    /* Special "narrative" panel for 2026 */
    .narrative {
      grid-column: 1 / -1;
      max-width: 720px;
      font-size: 1.5rem;
      line-height: 1.7;
      color: rgba(0,0,0,0.75);
    }
    .narrative .title {
      font-size: 2rem;
      font-weight: 700;
      color: #000;
      margin: 0 0 12px;
    }

    /* Hint to scroll */
    .scroll-hint {
      position: fixed;
      bottom: 24px;
      right: 32px;
      font-size: 1.2rem;
      color: rgba(0,0,0,0.4);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .scroll-hint.hidden { opacity: 0; }

    @media (max-width: 800px) {
      html, body { overflow: visible; height: auto; }
            .year-nav {
        padding: 12px 20px;
        position: sticky;
        background: #fafafa;
        z-index: 20;
      }
      .track {
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: visible;
        height: auto;
        padding-left: 0;
      }
      .panel,
      .panel.compact {
        width: 100%;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        padding: 32px 30px 40px;
        gap: 28px;
        border-right: none;
        border-bottom: 1px solid #eee;
        overflow-y: visible;
      }
      .panel:first-child { padding-left: 30px; }
      .panel:last-child { border-bottom: none; }
      .panel-year { font-size: 6rem; order: 1; }
      .panel-meta { display: contents; }
      .panel-projects { order: 2; }
      .panel-meta .company { order: 3; display: flex; flex-direction: column; gap: 6px; }
      .scroll-hint { display: none; }
    }
    .year-nav { padding-top: 8px; }
    .year-nav.active { display: flex; }
    @media (max-width: 800px) { .year-nav { top: 0; } }
  </style>
</head>

        const a = document.createElement(hasLink ? 'a' : 'div');
        a.className = 'project-card' + (hasLink ? '' : ' no-link');
        if (hasLink) a.href = p.href;
        a.innerHTML = `<img src="${p.img}" alt="${p.title}" loading="lazy"><h4 class="title">${p.title}</h4><p class="desc">${p.desc}</p>`;
        return a;
      });

      if (compact) {
        // Year is its own row spanning both columns; left = projects, right = companies
        panel.appendChild(yearEl);
        projectCards.forEach(a => projects.appendChild(a));
        companyEls.forEach(c => meta.appendChild(c));
        panel.appendChild(projects);
        panel.appendChild(meta);
      } else {
        meta.appendChild(yearEl);
        companyEls.forEach(c => meta.appendChild(c));
        projectCards.forEach(a => projects.appendChild(a));
        panel.appendChild(meta);
        panel.appendChild(projects);
      }

      track.appendChild(panel);
    });

    const isMobile = () => window.matchMedia('(max-width: 800px)').matches;

    // Keep year-nav stuck just below the main-nav on mobile, regardless of wrapping
    function syncStickyOffsets() {
      const mn = document.querySelector('.main-nav');
      const yn = document.querySelector('.year-nav');
      if (!mn || !yn) return;
      yn.style.top = isMobile() ? (mn.offsetHeight + 'px') : '';
    }
    window.addEventListener('load', syncStickyOffsets);
    window.addEventListener('resize', syncStickyOffsets);
    syncStickyOffsets();


    function goTo(idx) {
      const panel = track.children[idx];
      if (!panel) return;
      if (isMobile()) {
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        track.scrollTo({ left: panel.offsetLeft, behavior: 'smooth' });
      }
    }

    // Track active panel based on which one is closest to the focal point
    function updateActive() {
      let activeIdx = 0;
      let bestDist = Infinity;
      if (isMobile()) {
        const focalY = window.scrollY + 200;
        [...track.children].forEach((p, i) => {
          const top = p.offsetTop + track.offsetTop;
          const dist = Math.abs(top - focalY);
          if (top <= focalY && dist < bestDist) { bestDist = dist; activeIdx = i; }
        });
      } else {
        const focalX = track.scrollLeft + 120;
        [...track.children].forEach((p, i) => {
          const left = p.offsetLeft;
          const dist = Math.abs(left - focalX);
          if (left <= focalX + 50 && dist < bestDist) { bestDist = dist; activeIdx = i; }
        });
      }
      [...yearNav.children].forEach((b, i) => b.classList.toggle('active', i === activeIdx));
      const activeBtn = yearNav.children[activeIdx];
      if (activeBtn) {
        const navRect = yearNav.getBoundingClientRect();
        const btnRect = activeBtn.getBoundingClientRect();
        if (btnRect.left < navRect.left + 40 || btnRect.right > navRect.right - 40) {
          yearNav.scrollTo({ left: activeBtn.offsetLeft - navRect.width / 2 + btnRect.width / 2, behavior: 'smooth' });
        }
      }
    }

    // Hide scroll hint + update active year as user scrolls
    let scrolled = false;
    function onScroll() {
      const offset = isMobile() ? window.scrollY : track.scrollLeft;
      if (!scrolled && offset > 50) {
        scrolled = true;
        scrollHint.classList.add('hidden');
      }
      updateActive();
    }
    track.addEventListener('scroll', onScroll);
    window.addEventListener('scroll', onScroll);
    window.addEventListener('resize', updateActive);
    updateActive();
    // Keyboard arrows
    document.addEventListener('keydown', (e) => {
      const active = [...yearNav.children].findIndex(b => b.classList.contains('active'));
      if (e.key === 'ArrowRight' && active < data.length - 1) goTo(active + 1);
      if (e.key === 'ArrowLeft' && active > 0) goTo(active - 1);
    });

    // Deep link: timeline.html#y2019 jumps straight to that panel.
    // Runs now (panels already exist) and again on load in case layout shifted.
    function jumpToHash(smooth) {
      const id = decodeURIComponent(location.hash.slice(1));
      if (!id) return;
      const panel = [...track.children].find(p => p.id === id);
      if (!panel) return;
      const behavior = smooth ? 'smooth' : 'auto';
      if (isMobile()) panel.scrollIntoView({ behavior, block: 'start' });
      else track.scrollTo({ left: panel.offsetLeft, behavior });
      updateActive();
    }
    jumpToHash(false);
    window.addEventListener('load', () => jumpToHash(false));
    window.addEventListener('hashchange', () => jumpToHash(true));

  </script>
</body>
</html>
