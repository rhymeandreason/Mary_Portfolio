<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mary Huang : Art</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="//fonts.googleapis.com/css?family=Raleway:400,300,600,700" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/main.css">

  <link rel="icon" type="image/png" href="images/favicon.png">

  <style>
    .images-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 24px;
      margin: 24px 0 32px;
      font-size: 1.3rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 6px 14px;
      font: inherit;
      color: #555;
      cursor: pointer;
      letter-spacing: 0.02em;
      text-transform: capitalize;
    }
    .filter-btn:hover { border-color: #888; color: #000; }
    .filter-btn.active { background: #000; color: #fff; border-color: #000; }
    .empty {
      color: #999;
      font-size: 1.4rem;
      padding: 40px 0;
      text-align: center;
    }
    .masonry {
      column-count: 4;
      column-gap: 12px;
    }
    .masonry a {
      display: block;
      margin: 0 0 12px;
      break-inside: avoid;
      overflow: hidden;
      border-radius: 3px;
      background: #ececec;
      position: relative;
    }
    .masonry img,
    .masonry video {
      display: block;
      width: 100%;
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.25s ease;
    }
    .masonry a.loaded img,
    .masonry a.loaded video {
      opacity: 1;
    }
    .masonry a.loaded:hover img,
    .masonry a.loaded:hover video {
      transform: scale(1.03);
      opacity: 0.92;
    }
    .masonry a video { min-height: 120px; }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(20, 20, 20, 0.94);
      color: #fff;
      font-size: 1.2rem;
      line-height: 1.4;
      padding: 8px 12px;
      border-radius: 4px;
      max-width: 260px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    #tooltip.visible { opacity: 1; transform: translateY(0); }
    #tooltip .tt-title { font-weight: 700; display: block; margin-bottom: 2px; }
    #tooltip .tt-desc { color: rgba(255,255,255,0.8); }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.97);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .lightbox.open { display: flex; opacity: 1; }
    .lightbox-stage {
      position: relative;
      max-width: 90vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .lightbox-media {
      max-width: 90vw;
      max-height: 76vh;
      display: block;
      object-fit: contain;
      background: transparent;
    }
    .lightbox-meta {
      color: #000;
      text-align: center;
      font-size: 1.3rem;
      max-width: 640px;
      line-height: 1.5;
    }
    .lightbox-meta .lb-title {
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
      display: block;
      margin-bottom: 2px;
      color: #000;
    }
    .lightbox-meta .lb-desc { color: rgba(0,0,0,0.55); }
    .lightbox-meta .lb-more {
      display: inline-block;
      margin-top: 8px;
      margin-left: 12px;
      color: rgba(0,0,0,0.5);
      font-weight: 400;
      font-size: 1.2rem;
    }
    .lightbox-meta .lb-more:hover { color: #000; }
    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      border: none;
      background: transparent;
      color: rgba(0,0,0,0.4);
      font-size: 48px;
      line-height: 1;
      font-weight: 200;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
      font-family: inherit;
    }
    .lb-nav:hover { color: #000; }
    .lb-prev { left: 32px; }
    .lb-next { right: 32px; }
    .lb-close {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 60px;
      height: 60px;
      border: none;
      background: transparent;
      color: rgba(0,0,0,0.5);
      font-size: 48px;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .lb-close:hover { color: #000; }
    .lb-counter {
      position: absolute;
      top: 28px;
      left: 32px;
      color: rgba(0,0,0,0.4);
      font-size: 1.2rem;
      letter-spacing: .06em;
      font-variant-numeric: tabular-nums;
    }
    .lb-nav[disabled] { opacity: 0.2; cursor: default; }

    @media (max-width: 1100px) {
      .masonry { column-count: 3; }
    }
    @media (max-width: 750px) {
      .masonry { column-count: 2; }
    }
    @media (max-width: 450px) {
      .masonry { column-count: 1; }
    }
  </style>
</head>

                   Strings can be a filename (resolved against base) or
                   an absolute path starting with images/, projects/, or http.
                   Videos are auto-detected by .mp4/.m4v/.mov/.webm extension.

        media: [

          { src: 'sake1.jpg',   caption: 'Custom 3D printed ceramics' },
          { src: 'sake2.jpg',   caption: 'Custom 3D printed ceramics' },
          { src: 'sake3.jpg',   caption: 'Custom 3D printed ceramics' },
          // { src: 'sake4.jpg',   caption: 'Shapeways sake' },
          { src: 'vibe_white.jpg', caption: 'Soundcloud generated phone case' },
          { src: 'vibe_group.jpg', caption: 'Soundcloud generated phone case' },
        ],
      },
      {
        slug: 'westfield', name: 'Westfield', year: 2015,
        cats: ['sculpture', 'digital-fabrication'],
        caption: 'Concept for large scale outdoor sculpture',
        link: 'projects/westfield/westfield.html',
        media: [
          'sculpture_front.jpg',
          'sculpture_2.jpg',
          'sculpture_3.jpg',
          'sculpture_night1.jpg',
          // 'sculpture_night2.jpg',
          // 'sculpture-parts.jpg',
           'fabrication1.jpg',
          'fabrication3.jpg',
        ],
      },
    ];

    /* =============================================================
       Below this line: rendering, filtering, lightbox. No edits needed.
    ============================================================= */

    const VIDEO_RE = /\.(mp4|m4v|mov|webm)(\?|$)/i;
    const ABS_RE   = /^(https?:|images\/|projects\/)/;

    const projectMeta = Object.fromEntries(projects.map(p => [p.slug, p]));
    const projectOrder = projects.map(p => p.slug);

    function resolveSrc(p, src) {
      if (ABS_RE.test(src)) return src;
      const base = p.base || `projects/${p.slug}/`;
      return base + src;
    }

    // Flatten projects into per-tile data records
    const items = [];
    projects.forEach(p => {
      (p.media || []).forEach(m => {
        const entry = (typeof m === 'string') ? { src: m } : m;
        const src = resolveSrc(p, entry.src);
        const caption = entry.caption || p.caption || '';
        const isVideo = VIDEO_RE.test(src);
        const href = p.link || '#';
        items.push({
          slug: p.slug, name: p.name, year: p.year, cats: p.cats,
          src, caption, isVideo, href,
          external: /^https?:/.test(href),
        });
      });
    });

    function buildTile(item) {
      const a = document.createElement('a');
      a.dataset.slug = item.slug;
      a.href = item.href;
      if (item.external) { a.target = '_blank'; a.rel = 'noopener'; }

      let media;
      const markLoaded = () => a.classList.add('loaded');
      if (item.isVideo) {
        media = document.createElement('video');
        media.muted = true;
        media.setAttribute('autoplay', '');
        media.setAttribute('muted', '');
        media.setAttribute('loop', '');
        media.setAttribute('playsinline', '');
        media.addEventListener('loadeddata', markLoaded, { once: true });
        media.addEventListener('error', markLoaded, { once: true });
      } else {
        media = document.createElement('img');
        media.loading = 'lazy';
        media.addEventListener('load', markLoaded, { once: true });
        media.addEventListener('error', markLoaded, { once: true });
      }
      if (item.caption) media.setAttribute('alt', item.caption);
      media.src = item.src;
      // Already-cached media may finish before we attach the listener
      if (!item.isVideo && media.complete && media.naturalWidth) markLoaded();
      a.appendChild(media);
      return a;
    }

    function slugFromAnchor(a) { return a.dataset.slug; }

    const filtersEl = document.getElementById('filters');
    let activeFilter = 'all';
    categories.forEach(cat => {
      const b = document.createElement('button');
      b.className = 'filter-btn' + (cat === 'all' ? ' active' : '');
      b.textContent = cat.replace('-', ' ');
      b.dataset.cat = cat;
      b.addEventListener('click', () => {
        activeFilter = cat;
        filtersEl.querySelectorAll('.filter-btn').forEach(x => x.classList.toggle('active', x.dataset.cat === cat));
        render();
      });
      filtersEl.appendChild(b);
    });

    const galleryEl = document.getElementById('gallery');

    function appendClone(container, item) {
      container.appendChild(buildTile(item));
    }

    function render() {
      const filtered = items.filter(i => activeFilter === 'all' || i.cats.includes(activeFilter));
      galleryEl.innerHTML = '';
      if (!filtered.length) {
        galleryEl.innerHTML = '<div class="empty">Nothing here yet.</div>';
        return;
      }
      const m = document.createElement('div');
      m.className = 'masonry';
      filtered.forEach(i => appendClone(m, i));
      galleryEl.appendChild(m);
    }

    render();

    // Tooltip
    const tooltip = document.createElement('div');
    tooltip.id = 'tooltip';
    tooltip.innerHTML = '<span class="tt-title"></span><span class="tt-desc"></span>';
    document.body.appendChild(tooltip);
    const tipTitle = tooltip.querySelector('.tt-title');
    const tipDesc = tooltip.querySelector('.tt-desc');

    galleryEl.addEventListener('mouseover', e => {
      const a = e.target.closest('a');
      if (!a || !galleryEl.contains(a)) return;
      const media = a.querySelector('img, video');
      if (!media) return;
      const slug = slugFromAnchor(a);
      const meta = projectMeta[slug];
      tipTitle.textContent = meta ? meta.name : '';
      tipDesc.textContent = media.getAttribute('alt') || (meta && meta.caption) || '';
      tooltip.classList.add('visible');
    });
    galleryEl.addEventListener('mouseout', e => {
      if (!e.relatedTarget || !e.target.closest('a')?.contains(e.relatedTarget)) {
        tooltip.classList.remove('visible');
      }
    });
    galleryEl.addEventListener('mousemove', e => {
      if (!tooltip.classList.contains('visible')) return;
      const pad = 14;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      const r = tooltip.getBoundingClientRect();
      if (x + r.width + 8 > window.innerWidth) x = e.clientX - r.width - pad;
      if (y + r.height + 8 > window.innerHeight) y = e.clientY - r.height - pad;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    });

    // Lightbox
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = `
      <button class="lb-close" aria-label="Close">×</button>
      <div class="lb-counter"></div>
      <button class="lb-nav lb-prev" aria-label="Previous">‹</button>
      <div class="lightbox-stage">
        <div class="lb-media-wrap"></div>
        <div class="lightbox-meta">
          <span class="lb-title"></span>
          <span class="lb-desc"></span>
          <a class="lb-more" target="_blank" rel="noopener">See more →</a>
        </div>
      </div>
      <button class="lb-nav lb-next" aria-label="Next">›</button>
    `;
    document.body.appendChild(lb);
    const lbMediaWrap = lb.querySelector('.lb-media-wrap');
    const lbTitle = lb.querySelector('.lb-title');
    const lbDesc = lb.querySelector('.lb-desc');
    const lbMore = lb.querySelector('.lb-more');
    const lbCounter = lb.querySelector('.lb-counter');
    const lbPrev = lb.querySelector('.lb-prev');
    const lbNext = lb.querySelector('.lb-next');
    const lbClose = lb.querySelector('.lb-close');

    let lbGroup = [];
    let lbIndex = 0;

    function openLightbox(anchor) {
      const slug = slugFromAnchor(anchor);
      // Build group from currently rendered tiles with same slug
      const tiles = [...galleryEl.querySelectorAll('.masonry a')];
      lbGroup = tiles.filter(a => (slugFromAnchor(a)) === slug);
      lbIndex = lbGroup.indexOf(anchor);
      if (lbIndex < 0) lbIndex = 0;
      renderLightbox();
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function renderLightbox() {
      const a = lbGroup[lbIndex];
      const orig = a.querySelector('img, video');
      lbMediaWrap.innerHTML = '';
      let media;
      if (orig.tagName === 'VIDEO') {
        media = document.createElement('video');
        media.src = orig.src;
        media.autoplay = true; media.muted = true; media.loop = true; media.playsInline = true; media.controls = true;
      } else {
        media = document.createElement('img');
        media.src = orig.src;
        media.alt = orig.alt || '';
      }
      media.className = 'lightbox-media';
      lbMediaWrap.appendChild(media);

      const slug = slugFromAnchor(a);
      const meta = projectMeta[slug];
      lbTitle.textContent = meta ? meta.name : '';
      lbDesc.textContent = orig.getAttribute('alt') || (meta && meta.caption) || '';

      const href = a.getAttribute('href');
      if (href && href !== '#' && !(meta && meta.noLink)) {
        lbMore.style.display = 'inline-block';
        lbMore.href = href;
        if (href.startsWith('http')) {
          lbMore.target = '_blank';
        } else {
          lbMore.removeAttribute('target');
        }
      } else {
        lbMore.style.display = 'none';
      }

      lbCounter.textContent = lbGroup.length > 1 ? `${lbIndex + 1} / ${lbGroup.length}` : '';
      lbPrev.disabled = lbGroup.length <= 1;
      lbNext.disabled = lbGroup.length <= 1;
      lbPrev.style.display = lbGroup.length > 1 ? 'flex' : 'none';
      lbNext.style.display = lbGroup.length > 1 ? 'flex' : 'none';
    }

    function closeLightbox() {
      lb.classList.remove('open');
      lbMediaWrap.innerHTML = '';
      document.body.style.overflow = '';
    }

    function step(delta) {
      if (!lbGroup.length) return;
      lbIndex = (lbIndex + delta + lbGroup.length) % lbGroup.length;
      renderLightbox();
    }

    galleryEl.addEventListener('click', e => {
      const a = e.target.closest('.masonry a');
      if (!a || !galleryEl.contains(a)) return;
      e.preventDefault();
      openLightbox(a);
    });

    lbPrev.addEventListener('click', () => step(-1));
    lbNext.addEventListener('click', () => step(1));
    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
    });
  </script>

</body>
</html>
