  <style>
    .images-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 24px;
      margin: 24px 0 32px;
      font-size: 1.3rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 6px 14px;
      font: inherit;
      color: #555;
      cursor: pointer;
      letter-spacing: 0.02em;
      text-transform: capitalize;
    }
    .filter-btn:hover { border-color: #888; color: #000; }
    .filter-btn.active { background: #000; color: #fff; border-color: #000; }
    .group-by {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      color: #555;
    }
    .group-by select {
      font: inherit;
      padding: 5px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
    }
    .group-section { margin-bottom: 40px; }
    .group-header {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
      color: #000;
    }
    .group-header .count {
      font-weight: 400;
      color: #999;
      font-size: 1.3rem;
      margin-left: 8px;
    }
    .empty {
      color: #999;
      font-size: 1.4rem;
      padding: 40px 0;
      text-align: center;
    }
    .masonry {
      column-count: 4;
      column-gap: 12px;
    }
    .masonry a {
      display: block;
      margin: 0 0 12px;
      break-inside: avoid;
      overflow: hidden;
      border-radius: 3px;
      background: #ececec;
      position: relative;
    }
    .masonry img,
    .masonry video {
      display: block;
      width: 100%;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }
    .masonry a:hover img,
    .masonry a:hover video {
      transform: scale(1.03);
      opacity: 0.92;
    }
    .masonry a video { min-height: 120px; }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(20, 20, 20, 0.94);
      color: #fff;
      font-size: 1.2rem;
      line-height: 1.4;
      padding: 8px 12px;
      border-radius: 4px;
      max-width: 260px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    #tooltip.visible { opacity: 1; transform: translateY(0); }
    #tooltip .tt-title { font-weight: 700; display: block; margin-bottom: 2px; }
    #tooltip .tt-desc { color: rgba(255,255,255,0.8); }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.97);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .lightbox.open { display: flex; opacity: 1; }
    .lightbox-stage {
      position: relative;
      max-width: 90vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .lightbox-media {
      max-width: 90vw;
      max-height: 76vh;
      display: block;
      object-fit: contain;
      background: transparent;
    }
    .lightbox-meta {
      color: #000;
      text-align: center;
      font-size: 1.3rem;
      max-width: 640px;
      line-height: 1.5;
    }
    .lightbox-meta .lb-title {
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
      display: block;
      margin-bottom: 2px;
      color: #000;
    }
    .lightbox-meta .lb-desc { color: rgba(0,0,0,0.55); }
    .lightbox-meta .lb-more {
      display: inline-block;
      margin-top: 8px;
      margin-left: 12px;
      color: rgba(0,0,0,0.5);
      font-weight: 400;
      font-size: 1.2rem;
    }
    .lightbox-meta .lb-more:hover { color: #000; }
    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      border: none;
      background: transparent;
      color: rgba(0,0,0,0.4);
      font-size: 48px;
      line-height: 1;
      font-weight: 200;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
      font-family: inherit;
    }
    .lb-nav:hover { color: #000; }
    .lb-prev { left: 32px; }
    .lb-next { right: 32px; }
    .lb-close {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 60px;
      height: 60px;
      border: none;
      background: transparent;
      color: rgba(0,0,0,0.5);
      font-size: 48px;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .lb-close:hover { color: #000; }
    .lb-counter {
      position: absolute;
      top: 28px;
      left: 32px;
      color: rgba(0,0,0,0.4);
      font-size: 1.2rem;
      letter-spacing: .06em;
      font-variant-numeric: tabular-nums;
    }
    .lb-nav[disabled] { opacity: 0.2; cursor: default; }

    @media (max-width: 1100px) {
      .masonry { column-count: 3; }
    }
    @media (max-width: 750px) {
      .masonry { column-count: 2; }
    }
    @media (max-width: 450px) {
      .masonry { column-count: 1; }
    }
  </style>

      ddress:        { name: 'D.dress',               year: 2011, cats: ['fashion'], caption: 'Computational couture' },
      modakit:       { name: 'ModaKit',               year: 2014, cats: ['fashion', "interactive"], caption: 'Modular prototyping system for wearable tech' },
      rose:          { name: 'Google Rose',           year: 2015, cats: ['fashion', "interactive"], caption: 'Generative fashion design' },
      shapeways:     { name: 'Shapeways',             year: 2013, cats: ['3d-printing'] },
      westfield:     { name: 'Westfield',              year: 2015, cats: ['sculpture'], caption: 'Concept for large scale outdoor sculpture' },
    };

    const categories = ['all', 'fashion', '3d-printing', 'interactive', 'craft', 'sculpture', 'illustration'];

    function slugFromHref(href) {
      if (href.startsWith('http')) return 'colorandcraft';
      const m = href.match(/projects\/([^/]+)\//);
      return m ? m[1] : '';
    }

    const tpl = document.getElementById('items').content;
    const items = [...tpl.querySelectorAll('a')].map(a => {
      const slug = a.dataset.slug || slugFromHref(a.getAttribute('href'));
      const meta = projectMeta[slug] || { name: slug, year: 0, cats: [] };
      return { el: a, slug, name: meta.name, year: meta.year, cats: meta.cats };
    });

    const filtersEl = document.getElementById('filters');
    let activeFilter = 'all';
    categories.forEach(cat => {
      const b = document.createElement('button');
      b.className = 'filter-btn' + (cat === 'all' ? ' active' : '');
      b.textContent = cat.replace('-', ' ');
      b.dataset.cat = cat;
      b.addEventListener('click', () => {
        activeFilter = cat;
        filtersEl.querySelectorAll('.filter-btn').forEach(x => x.classList.toggle('active', x.dataset.cat === cat));
        render();
      });
      filtersEl.appendChild(b);
    });

    const groupByEl = document.getElementById('groupBy');
    groupByEl.addEventListener('change', render);
    const galleryEl = document.getElementById('gallery');

    // Stable per-project order for grouping
    const projectOrder = ['colorandcraft','art','illuminate','ar_ideas','lore','lore_illustrations','data_collection','typeface','n12','shoes','constrvct','ddress','modakit','rose','shapeways','westfield'];

    function render() {
      const filtered = items.filter(i => activeFilter === 'all' || i.cats.includes(activeFilter));
      galleryEl.innerHTML = '';
      if (!filtered.length) {
        galleryEl.innerHTML = '<div class="empty">Nothing here yet.</div>';
        return;
      }
      const groupBy = groupByEl.value;

      if (groupBy === 'none') {
        const m = document.createElement('div');
        m.className = 'masonry';
        filtered.forEach(i => m.appendChild(i.el.cloneNode(true)));
        galleryEl.appendChild(m);
        return;
      }

      const groups = new Map();
      filtered.forEach(i => {
        const keys = groupBy === 'project'
          ? [i.slug]
          : (activeFilter !== 'all' ? [activeFilter] : i.cats);
        keys.forEach(key => {
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(i);
        });
      });

      const sortedKeys = [...groups.keys()].sort((a, b) => {
        if (groupBy === 'project') {
          return projectOrder.indexOf(a) - projectOrder.indexOf(b);
        }
        return a.localeCompare(b);
      });

      sortedKeys.forEach(key => {
        const section = document.createElement('section');
        section.className = 'group-section';
        const h = document.createElement('h3');
        h.className = 'group-header';
        const label = groupBy === 'project' ? (projectMeta[key]?.name || key) : key.replace('-', ' ');
        h.innerHTML = `${label} <span class="count">${groups.get(key).length}</span>`;
        section.appendChild(h);
        const m = document.createElement('div');
        m.className = 'masonry';
        groups.get(key).forEach(i => m.appendChild(i.el.cloneNode(true)));
        section.appendChild(m);
        galleryEl.appendChild(section);
      });
    }

    render();

    // Tooltip
    const tooltip = document.createElement('div');
    tooltip.id = 'tooltip';
    tooltip.innerHTML = '<span class="tt-title"></span><span class="tt-desc"></span>';
    document.body.appendChild(tooltip);
    const tipTitle = tooltip.querySelector('.tt-title');
    const tipDesc = tooltip.querySelector('.tt-desc');

    galleryEl.addEventListener('mouseover', e => {
      const a = e.target.closest('a');
      if (!a || !galleryEl.contains(a)) return;
      const media = a.querySelector('img, video');
      if (!media) return;
      const slug = a.dataset.slug || slugFromHref(a.getAttribute('href'));
      const meta = projectMeta[slug];
      tipTitle.textContent = meta ? meta.name : '';
      tipDesc.textContent = media.getAttribute('alt') || (meta && meta.caption) || '';
      tooltip.classList.add('visible');
    });
    galleryEl.addEventListener('mouseout', e => {
      if (!e.relatedTarget || !e.target.closest('a')?.contains(e.relatedTarget)) {
        tooltip.classList.remove('visible');
      }
    });
    galleryEl.addEventListener('mousemove', e => {
      if (!tooltip.classList.contains('visible')) return;
      const pad = 14;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      const r = tooltip.getBoundingClientRect();
      if (x + r.width + 8 > window.innerWidth) x = e.clientX - r.width - pad;
      if (y + r.height + 8 > window.innerHeight) y = e.clientY - r.height - pad;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    });

    // Lightbox
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = `
      <button class="lb-close" aria-label="Close">×</button>
      <div class="lb-counter"></div>
      <button class="lb-nav lb-prev" aria-label="Previous">‹</button>
      <div class="lightbox-stage">
        <div class="lb-media-wrap"></div>
        <div class="lightbox-meta">
          <span class="lb-title"></span>
          <span class="lb-desc"></span>
          <a class="lb-more" target="_blank" rel="noopener">See more →</a>
        </div>
      </div>
      <button class="lb-nav lb-next" aria-label="Next">›</button>
    `;
    document.body.appendChild(lb);
    const lbMediaWrap = lb.querySelector('.lb-media-wrap');
    const lbTitle = lb.querySelector('.lb-title');
    const lbDesc = lb.querySelector('.lb-desc');
    const lbMore = lb.querySelector('.lb-more');
    const lbCounter = lb.querySelector('.lb-counter');
    const lbPrev = lb.querySelector('.lb-prev');
    const lbNext = lb.querySelector('.lb-next');
    const lbClose = lb.querySelector('.lb-close');

    let lbGroup = [];
    let lbIndex = 0;

    function openLightbox(anchor) {
      const slug = anchor.dataset.slug || slugFromHref(anchor.getAttribute('href'));
      // Build group from currently rendered tiles with same slug
      const tiles = [...galleryEl.querySelectorAll('.masonry a')];
      lbGroup = tiles.filter(a => (a.dataset.slug || slugFromHref(a.getAttribute('href'))) === slug);
      lbIndex = lbGroup.indexOf(anchor);
      if (lbIndex < 0) lbIndex = 0;
      renderLightbox();
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function renderLightbox() {
      const a = lbGroup[lbIndex];
      const orig = a.querySelector('img, video');
      lbMediaWrap.innerHTML = '';
      let media;
      if (orig.tagName === 'VIDEO') {
        media = document.createElement('video');
        media.src = orig.src;
        media.autoplay = true; media.muted = true; media.loop = true; media.playsInline = true; media.controls = true;
      } else {
        media = document.createElement('img');
        media.src = orig.src;
        media.alt = orig.alt || '';
      }
      media.className = 'lightbox-media';
      lbMediaWrap.appendChild(media);

      const slug = a.dataset.slug || slugFromHref(a.getAttribute('href'));
      const meta = projectMeta[slug];
      lbTitle.textContent = meta ? meta.name : '';
      lbDesc.textContent = orig.getAttribute('alt') || (meta && meta.caption) || '';

      const href = a.getAttribute('href');
      if (href && href !== '#' && !(meta && meta.noLink)) {
        lbMore.style.display = 'inline-block';
        lbMore.href = href;
        if (href.startsWith('http')) {
          lbMore.target = '_blank';
        } else {
          lbMore.removeAttribute('target');
        }
      } else {
        lbMore.style.display = 'none';
      }

      lbCounter.textContent = lbGroup.length > 1 ? `${lbIndex + 1} / ${lbGroup.length}` : '';
      lbPrev.disabled = lbGroup.length <= 1;
      lbNext.disabled = lbGroup.length <= 1;
      lbPrev.style.display = lbGroup.length > 1 ? 'flex' : 'none';
      lbNext.style.display = lbGroup.length > 1 ? 'flex' : 'none';
    }

    function closeLightbox() {
      lb.classList.remove('open');
      lbMediaWrap.innerHTML = '';
      document.body.style.overflow = '';
    }

    function step(delta) {
      if (!lbGroup.length) return;
      lbIndex = (lbIndex + delta + lbGroup.length) % lbGroup.length;
      renderLightbox();
    }

    galleryEl.addEventListener('click', e => {
      const a = e.target.closest('.masonry a');
      if (!a || !galleryEl.contains(a)) return;
      e.preventDefault();
      openLightbox(a);
    });

    lbPrev.addEventListener('click', () => step(-1));
    lbNext.addEventListener('click', () => step(1));
    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
    });
  </script>

</body>
</html>
