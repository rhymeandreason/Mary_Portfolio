    .images-page {

      align-items: center;
      gap: 24px;
      margin: 24px 0 32px;
      font-size: 1.3rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;

    .filter-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 999px;
      padding: 6px 14px;
      font: inherit;
      color: #555;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .filter-btn:hover { border-color: #888; color: #000; }
    .filter-btn.active { background: #000; color: #fff; border-color: #000; }
    .group-by {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      color: #555;
    }
    .group-by select {
      font: inherit;
      padding: 5px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
    }
    .group-section { margin-bottom: 40px; }
    .group-header {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
      color: #000;
    }
    .group-header .count {
      font-weight: 400;
      color: #999;
      font-size: 1.3rem;
      margin-left: 8px;
    }
    .empty {
      color: #999;
      font-size: 1.4rem;
      padding: 40px 0;
      text-align: center;
    }
    .masonry {
      column-count: 4;
      column-gap: 12px;
    }
    .masonry a {
      display: block;
      margin: 0 0 12px;
      break-inside: avoid;
      overflow: hidden;
      border-radius: 3px;
      background: #ececec;
    }
    .masonry img,
    .masonry video {
      width: 100%;
      display: block;
      transition: transform 0.4s ease, opacity 0.3s ease;
    }
    .masonry a:hover img,
    .masonry a:hover video {
      transform: scale(1.03);
      opacity: 0.92;
    }
    @media (max-width: 1100px) {
      .masonry { column-count: 3; }
    }
    @media (max-width: 750px) {
      .masonry { column-count: 2; }
    }
    @media (max-width: 450px) {
      .masonry { column-count: 1; }
    }

  <script>
    const projectMeta = {
      impulse:        { name: 'Impulse Stove',     year: 2024, cat: 'hardware' },
      biome:          { name: 'Biome',             year: 2022, cat: 'web/mobile' },
      stagecraft:     { name: 'ILM Stagecraft',    year: 2021, cat: 'tools' },
      tales:          { name: 'Tales from the Galaxy’s Edge', year: 2021, cat: 'spatial' },
      gestures:       { name: 'VR Hand Gestures',  year: 2020, cat: 'spatial' },
      viralnet:       { name: 'Viralnet',          year: 2020, cat: 'tools' },
      storyboard:     { name: 'Storyboard',        year: 2020, cat: 'tools' },
      codeland:       { name: 'Coding Land',       year: 2020, cat: 'web/mobile' },
      Amazon:         { name: 'Amazon Made For You', year: 2019, cat: 'web/mobile' },
      hack:           { name: 'Hack',              year: 2019, cat: 'web/mobile' },
      shield:         { name: 'Shield.ai',         year: 2018, cat: 'web/mobile' },
      quill_gallery:  { name: 'Quill Gallery',     year: 2017, cat: 'spatial' },
      quill:          { name: 'Oculus Quill',      year: 2016, cat: 'spatial' },
      ar_ideas:       { name: 'AR Ideas',          year: 2017, cat: 'spatial' },
      modakit:        { name: 'ModaKit',           year: 2014, cat: 'hardware' },
      rose:           { name: 'Google Rose',       year: 2014, cat: 'fashion' },
      constrvct:      { name: 'Constrvct',         year: 2013, cat: 'fashion' },
      shoes:          { name: '3D Printed Shoes',  year: 2013, cat: 'fashion' },
      shapeways:      { name: 'Shapeways',         year: 2012, cat: '3D' },
      n12:            { name: 'N12 Bikini',        year: 2012, cat: 'fashion' },
      turtlelink:     { name: 'SeaWorld TurtleLink', year: 2011, cat: 'spatial' },
      ddress:         { name: 'D.dress',           year: 2010, cat: 'fashion' },
      typeface:       { name: 'Typeface',          year: 2010, cat: 'tools' },
    };

    const categories = ['all', 'web/mobile', 'spatial', '3D', 'hardware', 'fashion', 'tools'];

    // Tag every item from the template using its href
    const tpl = document.getElementById('items').content;
    const items = [...tpl.querySelectorAll('a')].map(a => {
      const m = a.getAttribute('href').match(/projects\/([^/]+)\//);
      const slug = m ? m[1] : '';
      const meta = projectMeta[slug] || { name: slug, year: 0, cat: 'tools' };
      return { el: a, slug, ...meta };
    });

    // Build filter buttons
    const filtersEl = document.getElementById('filters');
    let activeFilter = 'all';
    categories.forEach(cat => {
      const b = document.createElement('button');
      b.className = 'filter-btn' + (cat === 'all' ? ' active' : '');
      b.textContent = cat;
      b.dataset.cat = cat;
      b.addEventListener('click', () => {
        activeFilter = cat;
        filtersEl.querySelectorAll('.filter-btn').forEach(x => x.classList.toggle('active', x.dataset.cat === cat));
        render();
      });
      filtersEl.appendChild(b);
    });

    const groupByEl = document.getElementById('groupBy');
    groupByEl.addEventListener('change', render);
    const galleryEl = document.getElementById('gallery');

    function render() {
      const filtered = items.filter(i => activeFilter === 'all' || i.cat === activeFilter);
      galleryEl.innerHTML = '';

      if (!filtered.length) {
        galleryEl.innerHTML = '<div class="empty">Nothing here yet.</div>';
        return;
      }

      const groupBy = groupByEl.value;

      if (groupBy === 'none') {
        const m = document.createElement('div');
        m.className = 'masonry';
        filtered.forEach(i => m.appendChild(i.el.cloneNode(true)));
        galleryEl.appendChild(m);
        return;
      }

      const groups = new Map();
      filtered.forEach(i => {
        const key = groupBy === 'project' ? i.name : groupBy === 'year' ? String(i.year) : i.cat;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(i);
      });

      const sortedKeys = [...groups.keys()].sort((a, b) => {
        if (groupBy === 'year') return Number(b) - Number(a);
        return a.localeCompare(b);
      });

      sortedKeys.forEach(key => {
        const section = document.createElement('section');
        section.className = 'group-section';
        const h = document.createElement('h3');
        h.className = 'group-header';
        h.innerHTML = `${key} <span class="count">${groups.get(key).length}</span>`;
        section.appendChild(h);
        const m = document.createElement('div');
        m.className = 'masonry';
        groups.get(key).forEach(i => m.appendChild(i.el.cloneNode(true)));
        section.appendChild(m);
        galleryEl.appendChild(section);
      });
    }

    render();
  </script>
