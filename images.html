      color: #555;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .filter-btn:hover { border-color: #888; color: #000; }
    .filter-btn.active { background: #000; color: #fff; border-color: #000; }
    .group-by {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      color: #555;
    }
    .group-by select {
      font: inherit;
      padding: 5px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;

    .group-section { margin-bottom: 40px; }
    .group-header {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
      color: #000;
    }
    .group-header .count {
      font-weight: 400;
      color: #999;
      font-size: 1.3rem;
      margin-left: 8px;
    }
    .empty {
      color: #999;
      font-size: 1.4rem;
      padding: 40px 0;
      text-align: center;
    }
    .masonry {
      column-count: 4;
      column-gap: 12px;
    }
    .masonry a {
      display: block;
      margin: 0 0 12px;
      break-inside: avoid;
      overflow: hidden;
      border-radius: 3px;
      background: #ececec;
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      animation: itemIn 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }
    @keyframes itemIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .group-section {
      animation: itemIn 0.35s ease forwards;
    }
    #gallery.fading { opacity: 0; transform: translateY(4px); }
    #gallery {
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .masonry img,
    .masonry video {
      width: 100%;
      display: block;
      transition: transform 0.4s ease, opacity 0.3s ease;
    }
    .masonry a:hover img,
    .masonry a:hover video {
      transform: scale(1.03);
      opacity: 0.92;
    }
    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(20, 20, 20, 0.94);
      color: #fff;
      font-size: 1.2rem;
      line-height: 1.4;
      padding: 8px 12px;
      border-radius: 4px;
      max-width: 260px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    #tooltip.visible { opacity: 1; transform: translateY(0); }
    #tooltip .tt-title { font-weight: 700; display: block; margin-bottom: 2px; }
    #tooltip .tt-desc { color: rgba(255,255,255,0.8); }
    @media (max-width: 1100px) {
      .masonry { column-count: 3; }
    }
    @media (max-width: 750px) {
      .masonry { column-count: 2; }
    }
    @media (max-width: 450px) {
      .masonry { column-count: 1; }
    }

    function captionFor(src) {
      const base = src.split('/').pop();
      return captions[base] || '';

    // Tag every item from the template using its href
    const tpl = document.getElementById('items').content;
    const items = [...tpl.querySelectorAll('a')].map(a => {
      const m = a.getAttribute('href').match(/projects\/([^/]+)\//);
      const slug = m ? m[1] : '';
      const meta = projectMeta[slug] || { name: slug, year: 0, cats: ['tools'] };
      const cats = meta.cats || (meta.cat ? [meta.cat] : []);
      return { el: a, slug, name: meta.name, year: meta.year, cats };
    });

    // Build filter buttons
    const filtersEl = document.getElementById('filters');
    let activeFilter = 'all';
    categories.forEach(cat => {

      b.className = 'filter-btn' + (cat === 'all' ? ' active' : '');

      b.dataset.cat = cat;
      b.addEventListener('click', () => {
        activeFilter = cat;
        filtersEl.querySelectorAll('.filter-btn').forEach(x => x.classList.toggle('active', x.dataset.cat === cat));
        render();
      });
      filtersEl.appendChild(b);
    });

    const groupByEl = document.getElementById('groupBy');
    groupByEl.addEventListener('change', render);
    const galleryEl = document.getElementById('gallery');

    let renderToken = 0;
    async function render() {
      const myToken = ++renderToken;
      const hasContent = galleryEl.children.length > 0;
      if (hasContent) {
        galleryEl.classList.add('fading');
        await new Promise(r => setTimeout(r, 180));
        if (myToken !== renderToken) return;
      }
      const filtered = items.filter(i => activeFilter === 'all' || i.cats.includes(activeFilter));
      galleryEl.innerHTML = '';
      galleryEl.classList.remove('fading');

      if (!filtered.length) {
        galleryEl.innerHTML = '<div class="empty">Nothing here yet.</div>';
        return;
      }

      const groupBy = groupByEl.value;

      if (groupBy === 'none') {
        const m = document.createElement('div');
        m.className = 'masonry';
        filtered.forEach((i, idx) => { const c = i.el.cloneNode(true); c.style.animationDelay = Math.min(idx * 18, 600) + 'ms'; m.appendChild(c); });
        galleryEl.appendChild(m);
        return;
      }

      const groups = new Map();
      filtered.forEach(i => {
        const keys = groupBy === 'project' ? [i.name]
                   : groupBy === 'year' ? [String(i.year)]
                   : i.cats;
        keys.forEach(key => {
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(i);
        });
      });

      const sortedKeys = [...groups.keys()].sort((a, b) => {
        if (groupBy === 'year') return Number(b) - Number(a);
        return a.localeCompare(b);
      });

      sortedKeys.forEach(key => {
        const section = document.createElement('section');
        section.className = 'group-section';
        const h = document.createElement('h3');
        h.className = 'group-header';
        h.innerHTML = `${key} <span class="count">${groups.get(key).length}</span>`;
        section.appendChild(h);
        const m = document.createElement('div');
        m.className = 'masonry';
        groups.get(key).forEach(i => m.appendChild(i.el.cloneNode(true)));
        section.appendChild(m);
        galleryEl.appendChild(section);
      });
    }

    render();

    // Tooltip
    const tooltip = document.createElement('div');
    tooltip.id = 'tooltip';
    tooltip.innerHTML = '<span class="tt-title"></span><span class="tt-desc"></span>';
    document.body.appendChild(tooltip);
    const tipTitle = tooltip.querySelector('.tt-title');
    const tipDesc = tooltip.querySelector('.tt-desc');

    galleryEl.addEventListener('mouseover', e => {
      const a = e.target.closest('a');
      if (!a || !galleryEl.contains(a)) return;
      const media = a.querySelector('img, video');
      if (!media) return;
      const m = a.getAttribute('href').match(/projects\/([^/]+)\//);
      const slug = m ? m[1] : '';
      const meta = projectMeta[slug];
      const desc = captionFor(media.getAttribute('src')) || media.getAttribute('alt') || '';
      tipTitle.textContent = meta ? meta.name : '';
      tipDesc.textContent = desc;
      tooltip.classList.add('visible');
    });
    galleryEl.addEventListener('mouseout', e => {
      if (!e.relatedTarget || !e.target.closest('a')?.contains(e.relatedTarget)) {
        tooltip.classList.remove('visible');
      }
    });
    galleryEl.addEventListener('mousemove', e => {
      if (!tooltip.classList.contains('visible')) return;
      const pad = 14;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      const r = tooltip.getBoundingClientRect();
      if (x + r.width + 8 > window.innerWidth) x = e.clientX - r.width - pad;
      if (y + r.height + 8 > window.innerHeight) y = e.clientY - r.height - pad;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    });
  </script>

</body>
</html>
